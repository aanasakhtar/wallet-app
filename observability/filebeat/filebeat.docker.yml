# Filebeat configuration for the DOCKER COMPOSE setup (Assignment 3).
#
# Pipeline:
# 1. Container logs (wallet replicas): Docker's json-file driver saves under
#    /var/lib/docker/containers/<id>/<id>-json.log -> decoded and shipped to Elasticsearch.
# 2. Envoy access logs: read from mounted /var/log/envoy/access.log as ndjson.

filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    stream: stdout

  - type: filestream
    id: envoy-access-logs
    enabled: true
    paths:
      - /var/log/envoy/*.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true

processors:
  # Only keep logs from the wallet app containers and envoy access logs
  - drop_event:
      when:
        and:
          - not:
              contains:
                container.image.name: wallet
          - not:
              contains:
                container.image.name: envoy
          - not:
              has_fields: ["upstream_cluster"]

  # Parse JSON from application stdout container logs
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true

  - drop_fields:
      fields: ["agent", "ecs", "input", "host.os", "log.offset", "stream"]
      ignore_missing: true

  - add_fields:
      target: ""
      fields:
        pipeline: filebeat-docker-input

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "wallet-logs-%{+yyyy.MM.dd}"

setup.template.name: "wallet-logs"
setup.template.pattern: "wallet-logs-*"
setup.ilm.enabled: false

setup.kibana:
  host: "http://kibana:5601"

logging.level: info
