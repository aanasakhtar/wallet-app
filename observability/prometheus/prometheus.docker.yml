# Prometheus configuration for the wallet app.
#
# scrape_interval of 5s is deliberately faster than the 15s default: the
# Part E experiment needs several scrapes inside a short fault window, and
# the assignment asks that each stage run long enough for several scrapes.
# In production 15-30s is more typical.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: wallet-app-monitor

scrape_configs:
  # -------------------------------------------------------------------------
  # The wallet application itself.
  # `instance` is what identifies the machine/process in Grafana.
  # -------------------------------------------------------------------------
  - job_name: wallet-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: wallet-api
          env: local

  # -------------------------------------------------------------------------
  # gRPC service (Assignment 2): its own process, so its own /metrics endpoint.
  # The shared business code records wallet_transactions_total etc. in THIS process,
  # so the series carry job="wallet-grpc"; dashboards use sum(...) to combine both jobs.
  # -------------------------------------------------------------------------
  - job_name: wallet-grpc
    metrics_path: /metrics
    static_configs:
      - targets: ["grpc:8002"]
        labels:
          service: wallet-grpc
          env: local

  # -------------------------------------------------------------------------
  # Node Exporter - host CPU, memory, disk and network (Part B requirement).
  # The machine being measured is whatever host runs node_exporter; the
  # `nodename` label below should be set to that machine's name in the report.
  # -------------------------------------------------------------------------
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          nodename: docker-host # <-- change to your machine's hostname
          env: local

  # -------------------------------------------------------------------------
  # Cardinality experiment app (Part E.2). Separate job so the demo's series
  # can be counted independently of the real app's.
  # -------------------------------------------------------------------------
  - job_name: cardinality-demo
    metrics_path: /metrics
    static_configs:
      - targets: ["cardinality-demo:8001"]
        labels:
          env: local

  # -------------------------------------------------------------------------
  # Prometheus scraping itself - useful for showing total series count
  # (prometheus_tsdb_head_series) during the cardinality experiment.
  # -------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
