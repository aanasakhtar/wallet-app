# Prometheus configuration for the wallet app (Docker Compose).
#
# scrape_interval of 5s allows rapid metric collection during load experiments.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: wallet-app-monitor

scrape_configs:
  # -------------------------------------------------------------------------
  # Replicas A, B, and C (Assignment 3, Part A & B)
  # Each runs run_replica.py exposing HTTP, gRPC, and all Prometheus metrics on :8000
  # -------------------------------------------------------------------------
  - job_name: wallet-app-a
    metrics_path: /metrics
    static_configs:
      - targets: ["app-a:8000"]
        labels:
          service: wallet-app
          replica: A
          env: local

  - job_name: wallet-app-b
    metrics_path: /metrics
    static_configs:
      - targets: ["app-b:8000"]
        labels:
          service: wallet-app
          replica: B
          env: local

  - job_name: wallet-app-c
    metrics_path: /metrics
    static_configs:
      - targets: ["app-c:8000"]
        labels:
          service: wallet-app
          replica: C
          env: local

  # -------------------------------------------------------------------------
  # Envoy Proxy (Assignment 3, Part B, C, D)
  # Scraped on admin port 9901 at /stats/prometheus
  # -------------------------------------------------------------------------
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]
        labels:
          service: envoy
          env: local

  # -------------------------------------------------------------------------
  # Legacy job definitions for backwards compatibility
  # -------------------------------------------------------------------------
  - job_name: wallet-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app-a:8000"]
        labels:
          service: wallet-api
          env: local

  # -------------------------------------------------------------------------
  # Node Exporter - host CPU, memory, disk and network
  # -------------------------------------------------------------------------
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          nodename: docker-host
          env: local

  # -------------------------------------------------------------------------
  # Prometheus scraping itself
  # -------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
