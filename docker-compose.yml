# Assignment 3: Load Balancing and Observability Stack.
#
# Services:
#   - db: PostgreSQL 16
#   - app-a, app-b, app-c: Three replicas of the wallet app (HTTP :8000, gRPC :50051)
#   - envoy: L7 reverse proxy & load balancer (:10000 HTTP, :10001 gRPC, :9901 Admin/Stats)
#   - prometheus: Metrics scraper (:9090)
#   - grafana: Metrics dashboard (:3000)
#   - elasticsearch & kibana: Structured log indexing and exploration (:9200, :5601)
#   - filebeat: Ships container logs and Envoy access logs to Elasticsearch

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Replica A
  app-a:
    build: .
    image: wallet-app:latest
    restart: unless-stopped
    command: python run_replica.py
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
      JWT_SECRET: change-me-in-production
      ADMIN_TOKEN: local-admin-token
      SERVICE_NAME: wallet-api
      REPLICA_ID: "A"
      RATE_LIMIT_TRANSFERS: "10000/60"
      LOG_DIR: /code/logs
      LOG_FILE_NAME: wallet-app-a.json
      HTTP_PORT: "8000"
      GRPC_PORT: "50051"
    ports:
      - "8001:8000"
    volumes:
      - app_logs:/code/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Replica B
  app-b:
    build: .
    image: wallet-app:latest
    restart: unless-stopped
    command: python run_replica.py
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
      JWT_SECRET: change-me-in-production
      ADMIN_TOKEN: local-admin-token
      SERVICE_NAME: wallet-api
      REPLICA_ID: "B"
      RATE_LIMIT_TRANSFERS: "10000/60"
      LOG_DIR: /code/logs
      LOG_FILE_NAME: wallet-app-b.json
      HTTP_PORT: "8000"
      GRPC_PORT: "50051"
    ports:
      - "8002:8000"
    volumes:
      - app_logs:/code/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Replica C
  app-c:
    build: .
    image: wallet-app:latest
    restart: unless-stopped
    command: python run_replica.py
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
      JWT_SECRET: change-me-in-production
      ADMIN_TOKEN: local-admin-token
      SERVICE_NAME: wallet-api
      REPLICA_ID: "C"
      RATE_LIMIT_TRANSFERS: "10000/60"
      LOG_DIR: /code/logs
      LOG_FILE_NAME: wallet-app-c.json
      HTTP_PORT: "8000"
      GRPC_PORT: "50051"
    ports:
      - "8003:8000"
    volumes:
      - app_logs:/code/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Envoy L7 Load Balancer
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "-c", "mkdir -p /var/log/envoy && chown -R 101:101 /var/log/envoy && exec /docker-entrypoint.sh -c /etc/envoy/envoy.yaml --log-level info"]
    depends_on:
      - app-a
      - app-b
      - app-c
    volumes:
      - ./observability/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - envoy_logs:/var/log/envoy
    ports:
      - "10000:10000"  # Downstream HTTP Listener
      - "10001:10001"  # Downstream gRPC Listener
      - "9901:9901"    # Envoy Admin / Stats Prometheus

  # Legacy app service alias for backwards compatibility
  app:
    build: .
    image: wallet-app:latest
    restart: unless-stopped
    profiles: ["legacy"]
    command: python run_replica.py
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet
      JWT_SECRET: change-me-in-production
      ADMIN_TOKEN: local-admin-token
      SERVICE_NAME: wallet-api
      REPLICA_ID: "A"
      LOG_DIR: /code/logs
      LOG_FILE_NAME: wallet-app.json
      HTTP_PORT: "8000"
      GRPC_PORT: "50051"
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/code/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------------- #
  # Metrics
  # --------------------------------------------------------------------- #

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning/datasources/datasource.docker.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./observability/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  # --------------------------------------------------------------------- #
  # Logging
  # --------------------------------------------------------------------- #

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    restart: unless-stopped
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.docker.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - envoy_logs:/var/log/envoy:ro
      - filebeat_data:/usr/share/filebeat/data

volumes:
  db_data:
  app_logs:
  envoy_logs:
  prom_data:
  grafana_data:
  es_data:
  filebeat_data:
